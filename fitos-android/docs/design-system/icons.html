<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitOS Icon Set</title>
<script src="theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{font-family:var(--font-body);color:var(--on-surface);background:var(--background);
  padding:calc(28px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) 80px max(16px, env(safe-area-inset-left,0px));max-width:920px;margin:0 auto}
h1{font:600 26px var(--font-body)}
.lede{color:var(--on-surface-variant);font-size:14px;margin:8px 0 20px;line-height:1.8;max-width:68ch}
.controls{display:flex;gap:16px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.controls label{font:500 13px var(--font-body);color:var(--on-surface-variant);display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--shape-md);padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tile .name{font:11px var(--font-mono);color:var(--subtle);direction:ltr}
a{color:var(--on-surface)}
</style>
</head>
<body>
<!-- FitOS ICON SPRITE — Material-outlined style, original geometry drawn in the manner of open
     sets (Lucide/Feather MIT · Material Symbols Apache-2.0). Token-driven: stroke=currentColor,
     width=var(--icon-stroke). Use: <svg class="ico"><use href="#i-home"/></svg>.
     Directional glyphs (back/chevrons) get class "ico--dir" so they mirror in RTL.
     Also holds the illustration symbols: muscle maps (i-mm-front / i-mm-back, regions driven by
     --mm-* custom properties) and body-journey figures (i-body-start / -now / -goal). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="mm-hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="1.3" height="4" fill="#FFFFFF" fill-opacity=".45"/>
    </pattern>
    <g id="mm-base">
      <circle cx="60" cy="18" r="12"/>
      <rect x="54" y="28" width="12" height="10" rx="4"/>
      <path d="M36 40Q60 34 84 40L88 62Q86 96 78 118H42Q34 96 32 62Z"/>
      <rect x="18" y="44" width="15" height="40" rx="7.5"/><rect x="87" y="44" width="15" height="40" rx="7.5"/>
      <rect x="14" y="85" width="12" height="38" rx="6"/><rect x="94" y="85" width="12" height="38" rx="6"/>
      <circle cx="19" cy="128" r="6"/><circle cx="101" cy="128" r="6"/>
      <path d="M42 116H78L82 138H38Z"/>
      <rect x="38" y="134" width="20" height="54" rx="9"/><rect x="62" y="134" width="20" height="54" rx="9"/>
      <rect x="40" y="188" width="16" height="42" rx="7"/><rect x="64" y="188" width="16" height="42" rx="7"/>
      <ellipse cx="47" cy="233" rx="9" ry="4"/><ellipse cx="73" cy="233" rx="9" ry="4"/>
    </g>
    <g id="mmf-delts"><ellipse cx="33" cy="49" rx="9" ry="8"/><ellipse cx="87" cy="49" rx="9" ry="8"/></g>
    <g id="mmf-chest"><path d="M59 46Q46 44 39 50Q38 62 44 68Q52 71 59 68Z"/><path d="M61 46Q74 44 81 50Q82 62 76 68Q68 71 61 68Z"/></g>
    <g id="mmf-biceps"><ellipse cx="25.5" cy="67" rx="5.5" ry="13"/><ellipse cx="94.5" cy="67" rx="5.5" ry="13"/></g>
    <g id="mmf-forearms"><ellipse cx="20" cy="103" rx="4.5" ry="13"/><ellipse cx="100" cy="103" rx="4.5" ry="13"/></g>
    <g id="mmf-abs"><rect x="51" y="74" width="8" height="10" rx="3"/><rect x="61" y="74" width="8" height="10" rx="3"/><rect x="51" y="86" width="8" height="10" rx="3"/><rect x="61" y="86" width="8" height="10" rx="3"/><rect x="51" y="98" width="8" height="12" rx="3"/><rect x="61" y="98" width="8" height="12" rx="3"/></g>
    <g id="mmf-obliques"><path d="M43 74L49 76V108L44 110Q40 92 43 74Z"/><path d="M77 74L71 76V108L76 110Q80 92 77 74Z"/></g>
    <g id="mmf-quads"><ellipse cx="48" cy="161" rx="8" ry="23"/><ellipse cx="72" cy="161" rx="8" ry="23"/></g>
    <g id="mmf-calves"><ellipse cx="48" cy="207" rx="5.5" ry="14"/><ellipse cx="72" cy="207" rx="5.5" ry="14"/></g>
    <g id="mmb-traps"><path d="M60 36L76 45L60 68L44 45Z"/></g>
    <g id="mmb-lats"><path d="M44 58Q37 72 42 98L56 89V67Z"/><path d="M76 58Q83 72 78 98L64 89V67Z"/></g>
    <g id="mmb-lowerback"><rect x="52" y="92" width="16" height="22" rx="5"/></g>
    <g id="mmb-glutes"><ellipse cx="50" cy="128" rx="10" ry="9"/><ellipse cx="70" cy="128" rx="10" ry="9"/></g>
    <g id="mmb-hamstrings"><ellipse cx="48" cy="164" rx="8" ry="21"/><ellipse cx="72" cy="164" rx="8" ry="21"/></g>
    <g id="mmb-calves"><ellipse cx="48" cy="205" rx="6.5" ry="15"/><ellipse cx="72" cy="205" rx="6.5" ry="15"/></g>
  </defs>

  <!-- illustration: muscle map, front -->
  <symbol id="i-mm-front" viewBox="0 0 120 240">
    <use href="#mm-base" style="fill:var(--mm-body)"/>
    <use href="#mmf-delts" style="fill:var(--mm-delts,var(--mm-muscle))"/><use href="#mmf-delts" fill="url(#mm-hatch)" style="opacity:var(--mm-delts-x,0)"/>
    <use href="#mmf-chest" style="fill:var(--mm-chest,var(--mm-muscle))"/><use href="#mmf-chest" fill="url(#mm-hatch)" style="opacity:var(--mm-chest-x,0)"/>
    <use href="#mmf-biceps" style="fill:var(--mm-biceps,var(--mm-muscle))"/><use href="#mmf-biceps" fill="url(#mm-hatch)" style="opacity:var(--mm-biceps-x,0)"/>
    <use href="#mmf-forearms" style="fill:var(--mm-forearms,var(--mm-muscle))"/><use href="#mmf-forearms" fill="url(#mm-hatch)" style="opacity:var(--mm-forearms-x,0)"/>
    <use href="#mmf-abs" style="fill:var(--mm-abs,var(--mm-muscle))"/><use href="#mmf-abs" fill="url(#mm-hatch)" style="opacity:var(--mm-abs-x,0)"/>
    <use href="#mmf-obliques" style="fill:var(--mm-obliques,var(--mm-muscle))"/><use href="#mmf-obliques" fill="url(#mm-hatch)" style="opacity:var(--mm-obliques-x,0)"/>
    <use href="#mmf-quads" style="fill:var(--mm-quads,var(--mm-muscle))"/><use href="#mmf-quads" fill="url(#mm-hatch)" style="opacity:var(--mm-quads-x,0)"/>
    <use href="#mmf-calves" style="fill:var(--mm-calves,var(--mm-muscle))"/><use href="#mmf-calves" fill="url(#mm-hatch)" style="opacity:var(--mm-calves-x,0)"/>
  </symbol>
  <!-- illustration: muscle map, back -->
  <symbol id="i-mm-back" viewBox="0 0 120 240">
    <use href="#mm-base" style="fill:var(--mm-body)"/>
    <use href="#mmb-traps" style="fill:var(--mm-traps,var(--mm-muscle))"/><use href="#mmb-traps" fill="url(#mm-hatch)" style="opacity:var(--mm-traps-x,0)"/>
    <use href="#mmf-delts" style="fill:var(--mm-delts,var(--mm-muscle))"/><use href="#mmf-delts" fill="url(#mm-hatch)" style="opacity:var(--mm-delts-x,0)"/>
    <use href="#mmb-lats" style="fill:var(--mm-lats,var(--mm-muscle))"/><use href="#mmb-lats" fill="url(#mm-hatch)" style="opacity:var(--mm-lats-x,0)"/>
    <use href="#mmf-biceps" style="fill:var(--mm-triceps,var(--mm-muscle))"/><use href="#mmf-biceps" fill="url(#mm-hatch)" style="opacity:var(--mm-triceps-x,0)"/>

    <use href="#mmb-hamstrings" style="fill:var(--mm-hamstrings,var(--mm-muscle))"/><use href="#mmb-hamstrings" fill="url(#mm-hatch)" style="opacity:var(--mm-hamstrings-x,0)"/>
    <use href="#mmb-calves" style="fill:var(--mm-calves,var(--mm-muscle))"/><use href="#mmb-calves" fill="url(#mm-hatch)" style="opacity:var(--mm-calves-x,0)"/>
  </symbol>
  <!-- illustration: body journey figures (fill = currentColor via CSS) -->

  <symbol id="i-body-now" viewBox="0 0 44 96"><circle cx="22" cy="9" r="7"/><rect x="10" y="18" width="24" height="36" rx="9"/><rect x="3.5" y="21" width="5" height="29" rx="2.5"/><rect x="35.5" y="21" width="5" height="29" rx="2.5"/><rect x="12.5" y="50" width="9" height="42" rx="4.5"/><rect x="22.5" y="50" width="9" height="42" rx="4.5"/></symbol>
  <symbol id="i-body-goal" viewBox="0 0 44 96"><circle cx="22" cy="9" r="7"/><rect x="12" y="18" width="20" height="36" rx="7"/><rect x="5.5" y="21" width="5" height="29" rx="2.5"/><rect x="33.5" y="21" width="5" height="29" rx="2.5"/><rect x="13.5" y="50" width="8.5" height="42" rx="4.25"/><rect x="22" y="50" width="8.5" height="42" rx="4.25"/></symbol>

  <!-- navigation -->

<h1>آیکون‌های FitOS</h1>
<p class="lede">اسپرایت SVG درون‌خطی با توکن: <code>stroke:currentColor</code> و ضخامت <code>--icon-stroke</code>. هندسه اختصاصی به سبک Material Symbols و Lucide. آیکون‌های جهت‌دار با کلاس <code>ico--dir</code> در راست‌چین قرینه می‌شوند. ایموجی هیچ‌وقت آیکون رابط نیست.</p>
<div class="controls">
  <label>ضخامت <input type="range" min="1" max="3" step="0.1" value="1.8" oninput="document.documentElement.style.setProperty('--icon-stroke',this.value)"></label>
  <label>اندازه <input type="range" min="16" max="40" step="2" value="28" oninput="document.documentElement.style.setProperty('--icon-large',this.value+'px')"></label>
  <select id="themeSel" aria-label="پوسته"><option value="light">روشن</option><option value="dark">تیره</option></select>
</div>
