# Builds and tests the FitOS Android app on every change under fitos-android/.
# The release APK is signed only when the four FITOS_* secrets exist; otherwise it is left unsigned.
name: FitOS Android

on:
  push:
    paths: ["fitos-android/**", ".github/workflows/fitos-android.yml"]
  pull_request:
    paths: ["fitos-android/**", ".github/workflows/fitos-android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fitos-android
    env:
      HAS_SIGNING_KEY: ${{ secrets.FITOS_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          FITOS_KEYSTORE_BASE64: ${{ secrets.FITOS_KEYSTORE_BASE64 }}
        run: |
          echo "$FITOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fitos-release.jks"
          echo "FITOS_KEYSTORE_PATH=$RUNNER_TEMP/fitos-release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        env:
          FITOS_KEYSTORE_PASSWORD: ${{ secrets.FITOS_KEYSTORE_PASSWORD }}
          FITOS_KEY_ALIAS: ${{ secrets.FITOS_KEY_ALIAS }}
          FITOS_KEY_PASSWORD: ${{ secrets.FITOS_KEY_PASSWORD }}
        run: ./gradlew test lintDebug assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitos-apk
          path: fitos-android/app/build/outputs/apk/release/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitos-reports
          path: |
            fitos-android/**/build/reports/
            fitos-android/app/build/screens/

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fitos-release.jks"
